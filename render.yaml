services:
  - type: web
    name: commitai
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_NAME
        value: CommitAI
      - key: LOG_LEVEL
        value: INFO
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: AI_PROVIDER
        value: openai
      - key: AI_MODEL
        value: gpt-4.1-mini
      - key: AI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
